<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- The daemon runs as root and owns the name; everyone may send to
       it (the methods gate themselves with polkit). -->
  <policy user="root">
    <allow own="org.lgmagic"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.lgmagic"/>
  </policy>

</busconfig>
