# lgmagic global configuration (TOML).
# Precedence: built-in defaults < this file < ~/.config/lgmagic/config.toml
# < --config FILE < CLI flags.  Unknown keys are ignored; a malformed file
# is skipped with a warning.

# Device selection: "" = auto-detect.
imu_device = ""
hidraw_device = ""

# Calibration JSON used by `lgmagic imu`/`lgmagic analyze` when no
# --calib flag is given.  The daemon resolves per-device calibration
# from the device file itself, not from here.
default_calib = ""

# IMU/airmouse tuning (daemon and standalone paths).
lpf_alpha = 0.2
mouse_scale = 30.0
madgwick_beta = 0.1
alpha = 0.2
mouse_k = 0.5
gyro_scale_default = 0.07

# Spring-back gate: the remote's pointer output springs back to its
# rest point after motion stops (firmware recentering).  The raw
# accelerometer discriminates real motion (a large deviation) from the
# spring (gravity +- noise at rest): the gate opens while dev > lo and
# closes, ABSORBING the deltas, when dev stays below lo/2 for a few
# frames.  Thresholds are in raw accelerometer counts.  accel_gate =
# false disables the gate entirely (kill-switch); an accelerometer that
# never reports disables it automatically.
accel_gate = true
accel_gate_lo = 60.0
accel_gate_hi = 400.0
