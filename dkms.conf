PACKAGE_NAME="lgmagic"
PACKAGE_VERSION="0.0.1"
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build modules"
CLEAN="make clean"
BUILT_MODULE_NAME[0]="lgmagic"
# The kernel Makefile builds with M=kernel/, so the .ko lands in kernel/
# instead of the DKMS build directory root.
BUILT_MODULE_LOCATION[0]="kernel"
DEST_MODULE_LOCATION[0]="/kernel/drivers/input/misc"
AUTOINSTALL="yes"
