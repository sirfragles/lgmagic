name: Release

on:
  push:
    tags:
      - 'v*'
  # Rollback path: re-run against an existing, correct tag with
  #   gh workflow run release.yml --ref vX.Y.Z
  # (the gate below still enforces that the ref name matches VERSION).
  workflow_dispatch:

# action-gh-release needs to create/update the Release and attach files.
permissions:
  contents: write

jobs:
  # Runs first and gates every build job: the tag must be exactly
  # v<VERSION> (the repository variable is the single source of truth,
  # like the ci.yml drift-gate). Never move a tag - a wrong tag is
  # deleted and re-created, or the release runs against the right one.
  gate:
    runs-on: ubuntu-latest
    env:
      V: ${{ vars.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert the tag matches the VERSION variable
        run: |
          if [ -z "$V" ]; then
            echo "::error::The VERSION repository variable is empty or unset."
            echo "::error::  gh variable set VERSION --repo sirfragles/lgmagic --body \"X.Y.Z\""
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match v$V (repository variable VERSION)"
            echo "::error::tags are immutable - delete a wrong release+tag and re-tag,"
            echo "::error::or re-run this workflow with --ref v$V instead."
            exit 1
          fi
          echo "OK: tag v$V matches the VERSION variable"

      - name: Stamp the version from the VERSION variable
        run: bash scripts/sync-version.sh "$V"
        # Idempotent and token-only; a no-op when the tag's tree already
        # carries V (it must - the release process bumps the tree in the
        # same commit as the variable, see RELEASING.md).

  # Debian: test-gated build of the .deb on the Ubuntu runner.
  deb:
    needs: gate
    runs-on: ubuntu-latest
    env:
      V: ${{ vars.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version from the VERSION variable
        run: bash scripts/sync-version.sh "$V"

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            linux-headers-$(uname -r) \
            linux-libc-dev \
            libsystemd-dev pkg-config \
            dkms debhelper dpkg-dev fakeroot
        # Same set as ci.yml; see that workflow for why each package is
        # needed. The gate above guarantees the tag is v<VERSION>, and
        # the sync step guarantees the tree stamps carry V.

      - name: Run the full test suite
        run: make check
        # Gate the release on the tools + unit tests + cli_smoke.sh.

      - name: Clean build artifacts before packaging
        run: make clean
        # Keep the CI's build artifacts (.o/.ko, the binaries) out of the
        # module sources that debian/rules ships into /usr/src/lgmagic-<VERSION>.

      - name: Build the Debian package
        run: dpkg-buildpackage -us -uc -b
        # Unsigned (-us -uc), binary-only (-b); the .deb lands in the
        # PARENT directory (../lgmagic-dkms_*.deb).

      - name: Stage the .deb inside the workspace
        run: |
          mkdir -p dist
          cp ../lgmagic-dkms_*.deb dist/

      - name: Upload the .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgmagic-dkms-deb
          path: dist/lgmagic-dkms_*.deb
          if-no-files-found: error

  # Fedora: rpmbuild in a fedora container.
  rpm:
    needs: gate
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      V: ${{ vars.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version from the VERSION variable
        run: bash scripts/sync-version.sh "$V"

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build gcc make systemd-devel systemd-rpm-macros pkgconf

      - name: Build the rpm
        run: |
          # The Source0 tarball must be lgmagic-$VERSION.tar.gz with the
          # matching top directory, or %setup cannot find it.
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          tar -czf ~/rpmbuild/SOURCES/lgmagic-$V.tar.gz \
            --exclude=.git --exclude='*.o' \
            --exclude=tools/lgmagic --exclude=tools/lgmagicd \
            --exclude=tools/tests/fake_devices \
            --transform="s,^,lgmagic-$V/," .
          cp rpm/lgmagic.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/lgmagic.spec

      - name: Stage the .rpm inside the workspace
        run: |
          # upload-artifact's globber fails on absolute paths with a
          # wildcard in a middle segment (RPMS/*/) - stage the file in
          # the workspace and upload a last-segment-only glob instead
          # (the same pattern the deb job uses).
          mkdir -p dist
          cp ~/rpmbuild/RPMS/*/lgmagic-[0-9]*.rpm dist/

      - name: Upload the .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgmagic-rpm
          # [0-9] right after the dash: excludes lgmagic-debuginfo/debugsource.
          path: dist/lgmagic-[0-9]*.rpm
          if-no-files-found: error

  # Arch: makepkg in an Arch container as a non-root builder. dkms is
  # AUR-only, so the package is built with --nodeps (AUR users get dkms
  # through their helper).
  arch:
    needs: gate
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      V: ${{ vars.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version from the VERSION variable
        run: bash scripts/sync-version.sh "$V"

      - name: Install build dependencies
        run: pacman -Sy --noconfirm --needed pkgconf systemd

      - name: Build the package with makepkg (non-root builder)
        run: |
          # The source tarball must be lgmagic-$V.tar.gz with the
          # matching top directory (PKGBUILD cds into lgmagic-$pkgver).
          useradd -m builder
          mkdir -p /tmp/pkg/src
          tar -czf /tmp/pkg/src/lgmagic-$V.tar.gz \
            --exclude=.git --exclude='*.o' \
            --exclude=tools/lgmagic --exclude=tools/lgmagicd \
            --exclude=tools/tests/fake_devices \
            --transform="s,^,lgmagic-$V/," .
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/pkg
          su builder -c '
            set -e
            # PKGDEST pins the package location - makepkg otherwise drops
            # it next to the PKGBUILD (cwd), outside BUILDDIR.
            export SRCDEST=/tmp/pkg/src PKGDEST=/tmp/pkg
            cd "$GITHUB_WORKSPACE/arch"
            BUILDDIR=/tmp/pkg makepkg -sf --noconfirm --nodeps
          '

      - name: Upload the package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgmagic-arch
          # [0-9] right after the dash: excludes the lgmagic-debug package.
          path: /tmp/pkg/lgmagic-[0-9]*.pkg.tar.zst
          if-no-files-found: error

  # Attach all three packages to the GitHub Release for the tag.
  release:
    needs: [deb, rpm, arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach the packages to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lgmagic-dkms_*.deb
            dist/lgmagic-[0-9]*.rpm
            dist/lgmagic-[0-9]*.pkg.tar.*
          fail_on_unmatched_files: true
        # fail_on_unmatched_files: a release that silently attached nothing
        # (or debuginfo/debugsource packages, the reason the globs require
        # a digit after the dash) must fail, not pass. The verify job
        # below double-checks the Release contents regardless.

  # Final check: the Release must carry EXACTLY the three expected
  # assets. A stray or missing package fails the whole run loudly.
  verify:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Assert the three release assets
        run: |
          set -euo pipefail
          names=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          total=$(printf '%s\n' "$names" | grep -c . || true)
          if [ "$total" -ne 3 ]; then
            echo "::error::expected exactly 3 assets on $GITHUB_REF_NAME, found $total:"
            printf '%s\n' "$names" | sed 's/^/    /'
            exit 1
          fi
          one() { # REGEX LABEL
            local n
            n=$(printf '%s\n' "$names" | grep -cE "$1" || true)
            if [ "$n" -ne 1 ]; then
              echo "::error::expected exactly 1 asset matching $2 ($1), found $n:"
              printf '%s\n' "$names" | sed 's/^/    /'
              exit 1
            fi
          }
          one '^lgmagic-dkms_.*\.deb$' 'the .deb'
          one '^lgmagic-[0-9].*\.rpm$' 'the .rpm'
          one '^lgmagic-[0-9].*\.pkg\.tar\.zst$' 'the .pkg.tar.zst'
          echo "OK: Release $GITHUB_REF_NAME carries exactly the 3 expected assets"
