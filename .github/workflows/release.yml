name: Release

on:
  push:
    tags:
      - 'v*'
  # Rollback path: re-run against an existing, correct tag with
  #   gh workflow run release.yml --ref vX.Y.Z
  # (the gate below still enforces that the ref name matches VERSION).
  workflow_dispatch:

# action-gh-release needs to create/update the Release and attach files.
permissions:
  contents: write

jobs:
  # Runs first and gates every build job: the tag must be exactly
  # v<VERSION> (the repository variable is the single source of truth,
  # like the ci.yml drift-gate). Never move a tag - a wrong tag is
  # deleted and re-created, or the release runs against the right one.
  gate:
    runs-on: ubuntu-latest
    env:
      V: ${{ vars.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert the tag matches the VERSION variable
        run: |
          if [ -z "$V" ]; then
            echo "::error::The VERSION repository variable is empty or unset."
            echo "::error::  gh variable set VERSION --repo sirfragles/lgmagic --body \"X.Y.Z\""
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match v$V (repository variable VERSION)"
            echo "::error::tags are immutable - delete a wrong release+tag and re-tag,"
            echo "::error::or re-run this workflow with --ref v$V instead."
            exit 1
          fi
          echo "OK: tag v$V matches the VERSION variable"

      - name: Stamp the version from the VERSION variable
        run: bash scripts/sync-version.sh "$V"
        # Idempotent and token-only; a no-op when the tag's tree already
        # carries V (it must - the release process bumps the tree in the
        # same commit as the variable, see RELEASING.md).

  # Multi-distro Debian-family releases: one build leg per supported
  # distro version (the per-platform matrix pattern), each leg tagging
  # the package revision with the distro so all five .debs coexist on
  # the same Release page under distinct names.
  deb:
    needs: gate
    runs-on: ubuntu-latest
    env:
      V: ${{ vars.VERSION }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", dist: ubuntu-22.04 }
          - { image: "ubuntu:24.04", dist: ubuntu-24.04 }
          - { image: "ubuntu:26.04", dist: ubuntu-26.04 }
          - { image: "debian:12", dist: debian-12 }
          - { image: "debian:13", dist: debian-13 }
    container:
      image: ${{ matrix.image }}
    steps:
      # The official base images ship no git; actions/checkout needs one.
      - name: Install git
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q && apt-get install -qy git

      - uses: actions/checkout@v4

      - name: Stamp the version from the VERSION variable
        run: bash scripts/sync-version.sh "$V"

      - name: Install build and packaging dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          apt-get install -qy build-essential pkg-config \
            libsystemd-dev debhelper dkms dpkg-dev

      - name: Run the full test suite
        run: make check
        # Gate the release on the tools + unit tests + cli_smoke.sh, on
        # the PRISTINE tree: the distro-tagged changelog written by the
        # next step is a container-local packaging detail that
        # check_version_sync would (correctly, for the repo tree) reject.

      - name: Tag the package revision with the distro
        run: |
          # The repo changelog stays "0.0.1-1 unstable" (sync-version.sh
          # owns that line); this leg rewrites only its CONTAINER copy,
          # so the .deb filename carries the distro:
          #   lgmagic-dkms_0.0.1-1~ubuntu24.04_amd64.deb
          # The ~<distro> revision follows the widespread convention
          # (Tailscale, Docker CE): it keeps the five files distinct on
          # the Release page, and its ordering below the plain revision
          # means a distro's own repackaging always wins. dkms.conf,
          # debian/rules and postinst all derive the plain $V from the
          # revision, so the DKMS tree stays /usr/src/lgmagic-$V and the
          # registration lgmagic/$V on every distro.
          . /etc/os-release
          CODENAME=${VERSION_CODENAME:-unstable}
          REV="$V-1~${ID}${VERSION_ID}"
          sed -i "1c\\lgmagic ($REV) $CODENAME; urgency=medium" debian/changelog
          echo "revision: $REV (distribution $CODENAME)"
          head -1 debian/changelog

      - name: Clean and build the package
        run: |
          make clean
          DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../lgmagic-dkms_*.deb dist/
          ls -la dist/
        # DEB_BUILD_OPTIONS=nocheck: dh_auto_test would re-run make check
        # against the distro-tagged changelog and trip the same version
        # guard that already passed above on the pristine tree.

      - name: Upload the .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgmagic-deb-${{ matrix.dist }}
          path: dist/lgmagic-dkms_*.deb
          if-no-files-found: error

  # Fedora: one leg per supported Fedora release. The rpm filename gets
  # its .fc<N> dist tag from the build container automatically, so the
  # two legs produce distinct, self-describing artifacts.
  rpm:
    needs: gate
    runs-on: ubuntu-latest
    env:
      V: ${{ vars.VERSION }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "fedora:43", dist: fedora-43 }
          - { image: "fedora:44", dist: fedora-44 }
    container:
      image: ${{ matrix.image }}
    steps:
      # The official base images ship no git; actions/checkout needs one.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Stamp the version from the VERSION variable
        run: bash scripts/sync-version.sh "$V"

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build gcc make systemd-devel systemd-rpm-macros pkgconf

      - name: Build the rpm
        run: |
          # The Source0 tarball must be lgmagic-$VERSION.tar.gz with the
          # matching top directory, or %setup cannot find it.
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          tar -czf ~/rpmbuild/SOURCES/lgmagic-$V.tar.gz \
            --exclude=.git --exclude='*.o' \
            --exclude=tools/lgmagic --exclude=tools/lgmagicd \
            --exclude=tools/tests/fake_devices \
            --transform="s,^,lgmagic-$V/," .
          cp rpm/lgmagic.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/lgmagic.spec

      - name: Verify the package contents
        run: |
          rpm=$(ls ~/rpmbuild/RPMS/*/lgmagic-$V*.rpm)
          for f in /usr/bin/lgmagic /usr/libexec/lgmagicd \
                   /usr/lib/systemd/system/lgmagicd.service \
                   /usr/lib/tmpfiles.d/lgmagic.conf \
                   /usr/share/polkit-1/actions/org.lgmagic.policy \
                   /usr/share/dbus-1/system.d/org.lgmagic.conf \
                   /etc/lgmagic/config.toml \
                   /usr/lib/udev/rules.d/51-lgimu.rules \
                   /usr/src/lgmagic-$V/dkms.conf; do
            rpm -qlp "$rpm" | grep -qxF "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "OK: all rpm files present"

      - name: Stage the .rpm inside the workspace
        run: |
          # upload-artifact's globber fails on absolute paths with a
          # wildcard in a middle segment (RPMS/*/) - stage the file in
          # the workspace and upload a last-segment-only glob instead.
          mkdir -p dist
          cp ~/rpmbuild/RPMS/*/lgmagic-[0-9]*.rpm dist/

      - name: Upload the .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgmagic-rpm-${{ matrix.dist }}
          # [0-9] right after the dash: excludes lgmagic-debuginfo/debugsource.
          path: dist/lgmagic-[0-9]*.rpm
          if-no-files-found: error

  # Arch: makepkg in an Arch container as a non-root builder. dkms is
  # AUR-only, so the package is built with --nodeps (AUR users get dkms
  # through their helper).
  arch:
    needs: gate
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      V: ${{ vars.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version from the VERSION variable
        run: bash scripts/sync-version.sh "$V"

      - name: Install build dependencies
        run: pacman -Sy --noconfirm --needed pkgconf systemd

      - name: Build the package with makepkg (non-root builder)
        run: |
          # The source tarball must be lgmagic-$V.tar.gz with the
          # matching top directory (PKGBUILD cds into lgmagic-$pkgver).
          useradd -m builder
          mkdir -p /tmp/pkg/src
          tar -czf /tmp/pkg/src/lgmagic-$V.tar.gz \
            --exclude=.git --exclude='*.o' \
            --exclude=tools/lgmagic --exclude=tools/lgmagicd \
            --exclude=tools/tests/fake_devices \
            --transform="s,^,lgmagic-$V/," .
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/pkg
          su builder -c '
            set -e
            # PKGDEST pins the package location - makepkg otherwise drops
            # it next to the PKGBUILD (cwd), outside BUILDDIR.
            export SRCDEST=/tmp/pkg/src PKGDEST=/tmp/pkg
            cd "$GITHUB_WORKSPACE/arch"
            BUILDDIR=/tmp/pkg makepkg -sf --noconfirm --nodeps
          '

      - name: Upload the package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgmagic-arch
          # [0-9] right after the dash: excludes the lgmagic-debug package.
          path: /tmp/pkg/lgmagic-[0-9]*.pkg.tar.zst
          if-no-files-found: error

  # Attach all packages (five .debs, two .rpms, the Arch package) to the
  # GitHub Release for the tag.
  release:
    needs: [deb, rpm, arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach the packages to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lgmagic-dkms_*.deb
            dist/lgmagic-[0-9]*.rpm
            dist/lgmagic-[0-9]*.pkg.tar.*
          fail_on_unmatched_files: true
        # fail_on_unmatched_files: a release that silently attached nothing
        # (or debuginfo/debugsource packages, the reason the globs require
        # a digit after the dash) must fail, not pass. The verify job
        # below double-checks the Release contents regardless.

  # Final check: the Release must carry EXACTLY the expected set - five
  # distro .debs, two Fedora .rpms and the Arch package. A stray or
  # missing package fails the whole run loudly.
  verify:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Assert the release asset set
        run: |
          set -euo pipefail
          names=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          total=$(printf '%s\n' "$names" | grep -c . || true)
          if [ "$total" -ne 8 ]; then
            echo "::error::expected exactly 8 assets on $GITHUB_REF_NAME, found $total:"
            printf '%s\n' "$names" | sed 's/^/    /'
            exit 1
          fi
          count() { # REGEX WANT LABEL
            local n
            n=$(printf '%s\n' "$names" | grep -cE "$1" || true)
            if [ "$n" -ne "$2" ]; then
              echo "::error::expected $2 asset(s) matching $3 ($1), found $n:"
              printf '%s\n' "$names" | sed 's/^/    /'
              exit 1
            fi
          }
          count '^lgmagic-dkms_.*_amd64\.deb$' 5 'the five distro .debs'
          count '^lgmagic-[0-9].*\.rpm$' 2 'the two Fedora .rpms'
          count '^lgmagic-[0-9].*\.pkg\.tar\.zst$' 1 'the Arch package'
          echo "OK: Release $GITHUB_REF_NAME carries exactly the 8 expected assets"
